name: Build Delivery App

# Triggered by the ERP via repository_dispatch (AppBuildService).
on:
  repository_dispatch:
    types: [build-delivery-app]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ github.event.client_payload.build_id }}
      APP_NAME: ${{ github.event.client_payload.app_name }}
      PACKAGE_ID: ${{ github.event.client_payload.package_id }}
      API_URL: ${{ github.event.client_payload.api_url }}
      PRIMARY_COLOR: ${{ github.event.client_payload.primary_color }}
      ICON_URL: ${{ github.event.client_payload.icon_url }}
      VERSION_NAME: ${{ github.event.client_payload.version_name }}
      VERSION_CODE: ${{ github.event.client_payload.version_code }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      CALLBACK_SECRET: ${{ secrets.APPBUILD_CALLBACK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Notify ERP that the build started.
      - name: Callback → building
        run: |
          BODY="{\"build_id\":${BUILD_ID},\"status\":\"building\",\"log_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | sed 's/^.* //')
          curl -s -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Signature: $SIG" --data "$BODY" || true

      # Release keystore from secrets.
      - name: Write keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Prepare branding
        run: |
          chmod +x tool/prepare.sh
          tool/prepare.sh

      - name: Build APK
        run: flutter build apk --release

      # Upload the signed APK to the ERP over HTTPS (multipart) — reliable from
      # GitHub runners (port 443), no SSH. The endpoint saves it, marks the build
      # ready, sets the download link and prunes old APKs. Retries for transients.
      - name: Upload APK to ERP
        run: |
          UPLOAD_URL="${CALLBACK_URL%/callback}/upload"
          SIG=$(printf '%s' "${BUILD_ID}:${VERSION_CODE}" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | sed 's/^.* //')
          n=0
          until [ "$n" -ge 4 ]; do
            code=$(curl -sS -o /tmp/up.json -w '%{http_code}' --max-time 300 -X POST "$UPLOAD_URL" \
              -H "X-Signature: $SIG" \
              -F "build_id=${BUILD_ID}" \
              -F "version_code=${VERSION_CODE}" \
              -F "apk=@build/app/outputs/flutter-apk/app-release.apk" || echo 000)
            if [ "$code" = "200" ]; then echo "→ uploaded (HTTP 200)"; cat /tmp/up.json; break; fi
            n=$((n+1)); echo "upload attempt $n failed (HTTP $code)"; cat /tmp/up.json 2>/dev/null || true; sleep "$((n*10))"
          done
          [ "$n" -ge 4 ] && { echo "upload failed after retries"; exit 1; } || true

      - name: Callback → failed
        if: failure()
        run: |
          BODY="{\"build_id\":${BUILD_ID},\"status\":\"failed\",\"error\":\"Build failed. See the workflow logs.\",\"log_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" | sed 's/^.* //')
          curl -s -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Signature: $SIG" --data "$BODY" || true
