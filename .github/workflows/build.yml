name: Build Delivery App
run-name: build-${{ github.event.client_payload.build_id }}

# Triggered by the ERP via repository_dispatch (AppBuildService). The runner only
# talks to GitHub — it builds a signed APK and stores it as an artifact. The ERP
# then pulls the artifact (VPS → GitHub), so no runner → VPS network path is ever
# needed (that path is unreliable from some runner IPs).
on:
  repository_dispatch:
    types: [build-delivery-app]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.client_payload.app_name }}
      PACKAGE_ID: ${{ github.event.client_payload.package_id }}
      API_URL: ${{ github.event.client_payload.api_url }}
      PRIMARY_COLOR: ${{ github.event.client_payload.primary_color }}
      ICON_URL: ${{ github.event.client_payload.icon_url }}
      VERSION_NAME: ${{ github.event.client_payload.version_name }}
      VERSION_CODE: ${{ github.event.client_payload.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Prepare branding
        run: |
          chmod +x tool/prepare.sh
          tool/prepare.sh

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 2
          if-no-files-found: error
